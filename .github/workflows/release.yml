name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-github-release:
    runs-on: ubuntu-latest
    env:
      TARGET_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@main
        with:
          tag-template: "v<version>"
          version: ${{ env.TARGET_RELEASE_VERSION }}
          ci-workflows: none
